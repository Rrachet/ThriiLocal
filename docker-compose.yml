services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - thriilocal-mongo:/data/db

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/thriilocal
      JWT_SECRET: local-development-secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

volumes:
  thriilocal-mongo:
