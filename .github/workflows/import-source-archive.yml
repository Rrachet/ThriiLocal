name: Import source archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Thrii source
        run: |
          unzip -q archive/Thrii.io-main.zip -d /tmp/thrii
          cp -a /tmp/thrii/Thrii.io-main/. .
          rm -rf /tmp/thrii archive/Thrii.io-main.zip
          rm -f backend/.env.test
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "import: restore complete Thrii.io source"
          git push
